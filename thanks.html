<!-- P-family: P-EMAIL-CAPTURE-20261115, signup thank-you, COO, OneCore Tech, Nov 15 2026 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Thanks for signing up for OneCore Tech updates.">
  <title>Thanks — OneCore Tech</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --fg: #f7f4ea;
      --muted: #ddd8c8;
      --accent: #f2d07a;
      --link: #ffe9a0;
      --line: #3d3b34;
      --card: #161614;
      --focus: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.25rem;
      line-height: 1.7;
      font-weight: 400;
    }
    a {
      color: var(--link);
      text-decoration-thickness: 0.12em;
      text-underline-offset: 0.18em;
    }
    a:hover { text-decoration-thickness: 0.18em; }
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }
    .skip {
      position: absolute;
      left: 0.75rem;
      top: -4rem;
      background: var(--accent);
      color: #111;
      font-weight: 700;
      padding: 0.6rem 1rem;
      z-index: 10;
    }
    .skip:focus { top: 0.75rem; }
    .wrap {
      width: min(46rem, calc(100% - 2.5rem));
      margin: 0 auto;
    }
    header {
      border-bottom: 1px solid var(--line);
      padding: 1.1rem 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      color: inherit;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 1.35rem;
    }
    .mark {
      width: 2.1rem;
      height: 2.1rem;
      flex: 0 0 2.1rem;
      border: 3px solid var(--accent);
      border-radius: 0.28rem;
      position: relative;
      background: #111;
    }
    .mark::after {
      content: "";
      position: absolute;
      right: -3px;
      top: -3px;
      width: 0.7rem;
      height: 0.7rem;
      background: var(--accent);
    }
    main { padding: 2.4rem 0 3.5rem; }
    h1 {
      line-height: 1.2;
      letter-spacing: 0.01em;
      font-weight: 750;
      margin: 0 0 0.85rem;
      font-size: clamp(2.1rem, 6vw, 3rem);
    }
    p { margin: 0 0 1.05rem; }
    footer {
      border-top: 1px solid var(--line);
      padding: 1.6rem 0 2.4rem;
      color: var(--muted);
      font-size: 1.1rem;
    }
    footer p { margin: 0 0 0.5rem; }
  </style>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header>
    <div class="wrap">
      <a class="brand" href="/index.html">
        <span class="mark" aria-hidden="true"></span>
        <span>OneCore Tech</span>
      </a>
    </div>
  </header>
  <main id="content">
    <div class="wrap">
      <h1>You're signed up</h1>
      <p>Thanks for joining the OneCore Tech list. We'll email occasionally with updates. Cash App only for any paid offers.</p>
      <p><a href="/index.html">Back to OneCore Tech</a></p>
    </div>
  </main>
  <footer>
    <div class="wrap">
      <p>OneCore Tech · Marion, South Carolina · 2026</p>
    </div>
  </footer>
</body>
</html>
